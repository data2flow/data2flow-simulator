# 로컬 개발. 인프라는 s3 SSH 터널·공용 개발 DB로 붙는다(design/deployment.md §8.2). 비밀값은 루트 .env
# 공용 DB이므로 Flyway는 validate만(ADR-030). 실행기·하트비트는 끈다: 로컬이 운영과 같은 DB의 실행을 넘겨받거나
# 같은 조직의 상시 환경을 한 번 더 돌리지 않게 한다. 켜려면 DATA2FLOW_SIM_ORGANIZATION_IDS에 개발용 조직만 넣고 executor.enabled=true
logging:
  level:
    net.java21.data2flow: DEBUG
data2flow:
  sim:
    env: dev
    core-uri: ${DATA2FLOW_CORE_URI:http://localhost:8082}
    executor:
      enabled: ${DATA2FLOW_SIM_EXECUTOR_ENABLED:false}
    stream:
      # 서버가 알려 주는 10.116.64.14 대신 터널 localhost:5552로 접속
      use-configured-address: true
