# 통합 시험(Testcontainers PostgreSQL 18·RabbitMQ 3.13 Stream). 실제 s3·s4 인프라와 공용 MQTT 브로커에는 붙지 않는다
spring:
  rabbitmq:
    virtual-host: /
data2flow:
  sim:
    env: test
    instance-id: simulator-test-0
    flyway-mode: migrate
    organization-ids: 1,2
    source-ids:
      "1": 3
      "2": 4
    core-uri: http://127.0.0.1:9
    executor:
      # 시험은 MutableClock을 움직이고 실행기 round()를 직접 부른다(Thread.sleep 없음)
      enabled: false
      lease: 30s
    stream:
      virtual-host: /
    heartbeat:
      enabled: false
    retention:
      enabled: false
